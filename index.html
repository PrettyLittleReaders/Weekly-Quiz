body {

  background: linear-gradient(270deg, #000000, #2b0000, #ffffff, #1a0000, #000000);
  background-size: 800% 800%;
  animation: rippleBG 40s ease infinite; /* slowed down */
}

/* Background animation */
@keyframes rippleBG {
  0% { background-position: 0% 50%; }
  25% { background-position: 50% 100%; }
  50% { background-position: 100% 50%; }
  75% { background-position: 50% 0%; }
  100% { background-position: 0% 50%; }
}

#nameOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  justify-content: center;
  align-items: center;

}

#nameBox {

  text-align: center;

#nameInput {

  margin-top: 15px;
  border-radius: 6px;
  border: none;
  background: #330000;
  color: #fff;
  font-size: 16px;
}

/* Smoke layer */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
  animation: smokeMove 60s linear infinite;
  pointer-events: none;
}

/* Smoke animation */
@keyframes smokeMove {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-10%, -10%) scale(1.2); }
  100% { transform: translate(0, 0) scale(1); }
}

/* Petal container */
.embers {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

/* Modal overlay */
#popupOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

/* Modal box */
#popupBox {
  background: #000;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 20px rgba(255,0,0,0.7);
  width: 90%;
  max-width: 400px;
}

/* Blur background when active */
.blur {
  filter: blur(8px);
  pointer-events: none;
}

/* Rose petal particles */
.ember {
  position: absolute;
  width: 10px;
  height: 14px;
  background: radial-gradient(circle at 30% 30%, #ff4d6d, #b3003c);
  border-radius: 60% 60% 60% 60%;
  transform: rotate(45deg);
  opacity: 0.8;
  animation: fall linear infinite;
}

/* Falling animation */
@keyframes fall {
  0% {
    transform: translateY(-10vh) translateX(0) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: 1; }
  100% {
    transform: translateY(110vh) translateX(50px) rotate(360deg);
    opacity: 0;
  }
}

h1 {

.container {

button {

  border-radius: 5px;
  width: 100%;
  margin-top: 10px;

button:hover {

}

#result {

  text-align: center;
  font-size: 18px;
  color: #ffffff;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);

@media (max-width: 600px) {

// Shuffle
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

let selectedQuestions = [];

function generateQuiz() {
  let form = document.getElementById("quizForm");
  form.innerHTML = "";

let shuffled = [...questionBank];
shuffle(shuffled);
selectedQuestions = shuffled.slice(0, 10);

  selectedQuestions.forEach((q, index) => {
    let div = document.createElement("div");
    div.classList.add("question");

    let html = `<p><b>Q${index + 1}:</b> ${q.question}</p>`;
    html += `<div class="answers">`;

    q.answers.forEach((a, i) => {
  html += `
    <label>
      <input type="radio" name="q${index}" value="${i}">
      ${a.text}
    </label>
  `;
});

    html += `</div>`;

    div.innerHTML = html;
    form.appendChild(div);
  });
}
function submitQuiz() {
  let score = 0;
  let reviewHTML = "";

  selectedQuestions.forEach((q, index) => {
    let selected = document.querySelector(`input[name="q${index}"]:checked`);

    let correctAnswer = q.answers.find(a => a.correct);
    let correctText = correctAnswer.text;

    if (selected) {
      let userAnswer = q.answers[selected.value];

      if (userAnswer.correct) {
        score++;
      } else {
        reviewHTML += `
          <p style="color:#ff4d4d;">
            ❌ <b>${q.question}</b><br>
            Your answer: ${userAnswer.text}<br>
            ✅ Correct answer: ${correctText}
          </p>
        `;
      }
    } else {
      reviewHTML += `
        <p style="color:#ffcc00;">
          ⚠️ <b>${q.question}</b><br>
          You didn’t answer this.<br>
          ✅ Correct answer: ${correctText}
        </p>
      `;
    }
  });

  let result = "";

  if (score <= 3) result = "📖 Beginner Reader";
  else if (score <= 6) result = "📚 Casual Bookworm";
  else if (score <= 8) result = "🔥 Avid Reader";
  else result = "👑 Bookish Expert";

  let finalText = `
    👤 ${userName}<br><br>
    You got ${score}/10 correct!<br><br>
    ${result}
    <hr>
    <h3>Review:</h3>
    ${reviewHTML || "Perfect score! 🔥"}
  `;

  document.getElementById("popupResult").innerHTML = finalText;
  document.getElementById("popupOverlay").style.display = "flex";

  document.querySelector(".container").classList.add("blur");
  document.querySelector("h1").classList.add("blur");
}

/* Generate petals */
function createEmbers() {
  const container = document.getElementById("embers");

  for (let i = 0; i < 40; i++) {
    let ember = document.createElement("div");
    ember.classList.add("ember");

    ember.style.left = Math.random() * 100 + "vw";
    ember.style.animationDuration = (8 + Math.random() * 12) + "s"; // slower fall
    ember.style.opacity = Math.random();

    container.appendChild(ember);
  }
}

function getWeekNumberThursday() {
  const now = new Date();
  now.setHours(0, 0, 0, 0);

  const day = now.getDay(); // 0 = Sunday, 4 = Thursday

  // Shift so Thursday becomes the "start"
  const diff = (day - 4 + 7) % 7;

  const thursday = new Date(now);
  thursday.setDate(now.getDate() - diff);

  const anchor = new Date(2024, 0, 4); // a known Thursday

  const weekNumber = Math.floor(
    (thursday - anchor) / (7 * 24 * 60 * 60 * 1000)
  );

  return weekNumber;
}
